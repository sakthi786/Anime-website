<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="anime.css">
</head>
<body>
  <form id="registerForm" onsubmit="validateRegistration(event)">
    <div class="d-flex justify-content-center align-items-center vh-100 bg-light" style="background-image: url('anime pic.jpg');">
      <div class="text-center p-5 m-3 border-info rounded text-white" style="width: 500px; background: rgba(0,0,0,0.6);">
        <h2 class="mb-4">Register</h2>

        <!-- Username Field -->
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="uname" placeholder="User Name" autocomplete="off">
          <label for="uname">User Name</label>
          <span id="msg"></span>
        </div>

        <!-- Name Field -->
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="name" placeholder="Name" autocomplete="off">
          <label for="name">Name</label>
          <span id="msg1"></span>
        </div>

        <!-- Email Field -->
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="mail" placeholder="Email" autocomplete="off">
          <label for="mail">E-mail</label>
          <span id="msg2"></span>
        </div>

        <!-- Mobile Number Field -->
        <div class="form-floating mb-3">
          <input type="number" class="form-control" id="ph" placeholder="Mobile Number" autocomplete="off">
          <label for="ph">Mobile No</label>
          <span id="msg3"></span>
        </div>

        <!-- Password Field with Icon for Toggle -->
        <div class="form-floating mb-4 position-relative">
          <input type="password" class="form-control" id="pass" placeholder="Password" autocomplete="off">
          <label for="pass">Password</label>
          <span id="msg4"></span>
        
          <!-- Eye Toggle Icon Button -->
          <button type="button" onclick="togglePassword(event)" class="btn position-absolute top-50 end-0 translate-middle-y me-3 p-0 border-0 bg-transparent">
            <i id="eyeIcon" class="bi bi-eye fs-4"></i> <!-- Eye Icon only -->
          </button>
        </div>

        <!-- Submit and Cancel Buttons -->
        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-success w-45">Register</button>
          <button type="reset" class="btn btn-danger w-45">Clear</button>
        </div>

        <!-- Already have an account link -->
        <div class="mt-3">
          <p>Already have an account? <a href="login.html" class="text-decoration-none text-white">Login</a></p>
        </div>
      </div>
    </div>
  </form>

  <script src="register.js"></script> <!-- External JavaScript File -->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Episodes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link type="text/css" rel="stylesheet" href="anime.css">
</head>
<body>

  <!-- Header Section -->
  <div class="d-flex justify-content-end p-3 bg-dark">
    <span id="welcomeUser" class="text-white me-3"></span>
    <button onclick="logout()" class="btn btn-danger">Logout</button>
  </div>
  
  
  
    
  <div class="netflix-bg">
    <div class="overlay"></div>
    <div class="content-box text-center">
      <h1 class="display-4">Anime World</h1>
      <p class="lead">Explore the best anime series and movies</p>
    </div>
  </div>

  <!-- Search and Anime List Section -->
  <div class="container mt-5">
    <div class="d-flex justify-content-center mb-4">
      <input id="searchInput" type="text" class="form-control w-50" placeholder="Search anime...">
      <button onclick="searchAnime()" class="btn btn-primary ms-2">Search</button>
    </div>

    <div id="animeList" class="row">
      <!-- Anime cards will be injected here -->
    </div>
  </div>

  <script src="anime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="anime.css"/>
</head>
<body>
  <div class="d-flex justify-content-center align-items-center vh-100 bg-light" style="background-image: url('anime pic.jpg');">
    <div class="text-center p-5 m-3 border-info rounded text-white" style="width: 500px; background: rgba(0,0,0,0.6);">
      <h2 class="mb-4">Forgot Password</h2>

      <!-- Email Field -->
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="Enter your registered email" autocomplete="off">
        <label for="email">Email</label>
        <span id="msg" style="color:red;"></span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary w-100" onclick="resetPassword(event)">Reset Password</button>

      <!-- Back to Login Link -->
      <div class="mt-3">
        <p><a href="login.html" class="text-decoration-none text-white">Back to Login</a></p>
      </div>
    </div>
  </div>

  <script src="forgot.js"></script> <!-- External JavaScript File -->
</body>
</html>

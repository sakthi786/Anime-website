<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="anime.css"/>
</head>
<body>
  <form id="loginForm" onsubmit="Log(event)">
    <div class="d-flex justify-content-center align-items-center vh-100 bg-light" style="background-image: url('anime pic.jpg');">
      <div class="text-center p-5 m-3 border-info rounded text-white" style="width: 500px; background: rgba(0,0,0,0.6);">
        <h2 class="mb-4">Login</h2>

        <!-- Username Field -->
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="uname" placeholder="User Name" autocomplete="off">
          <label for="uname">User Name</label>
          <span id="msg" style="color:red;"></span>
        </div>

        <!-- Password Field with Icon -->
        <div class="form-floating mb-4 position-relative">
          <input type="password" class="form-control" id="pass" placeholder="Password" autocomplete="off">
          <label for="pass">Password</label>
          <span id="msg4" style="color:red;"></span>

          <!-- Toggle Password Visibility -->
          <button type="button" onclick="togglePassword(event)" class="btn position-absolute top-50 end-0 translate-middle-y me-3 p-0 border-0 bg-transparent">
            <i id="eyeIcon" class="bi bi-eye fs-4"></i>
          </button>
        </div>

        <!-- Login and Clear Buttons -->
        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-success w-45">Login</button>
          <button type="reset" class="btn btn-danger w-45">Clear</button>
        </div>

        <!-- Register Link -->
        <div class="mt-3">
          <p>Don't have an account? <a href="index.html" class="text-decoration-none text-white">Register</a></p>
        </div>

        <!-- Remember Me -->
        <div class="form-check mb-2">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember Me</label>
        </div>

        <!-- Forgot Password -->
        <div class="mb-2">
          <p><a href="forgot.html" class="text-decoration-none text-warning">Forgot Password?</a></p>
        </div>
      </div>
    </div>
  </form>

  <script src="login.js"></script>
</body>
</html>
